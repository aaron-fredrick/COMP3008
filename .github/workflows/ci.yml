name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    strategy:
      matrix:
        dotnet-version:
          - '8.0.x'
          - '9.0.x'
          - '10.0.x'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Build solution
        shell: powershell
        run: dotnet build COMP3008.slnx --configuration Debug

      - name: Run server-backed integration tests
        shell: powershell
        run: .\scripts\ci\run-integration-tests.ps1

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ matrix.dotnet-version }}
          path: artifacts/integration/
          if-no-files-found: warn
          retention-days: 14