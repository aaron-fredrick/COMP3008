name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    strategy:
      matrix:
        dotnet-version:
          - '8.0.x'
          - '9.0.x'
          - '10.0.x'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Build solution
        shell: powershell
        run: dotnet build COMP3008.slnx --configuration Debug

      - name: Run tests
        shell: powershell
        run: dotnet test COMP3008.slnx --configuration Debug