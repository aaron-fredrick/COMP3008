name: CI

on:
  push:
    branches: [ main, feature/p0-correctness ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        shell: powershell
        run: .\build.ps1 -Configuration Debug

      - name: Run server-backed integration tests
        shell: powershell
        run: .\scripts\ci\run-integration-tests.ps1

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: artifacts/integration/
          if-no-files-found: warn
          retention-days: 14
